<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AAC Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AAC Board">
<meta name="theme-color" content="#1e6ec8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown only when the iPad is held upright (see styles.css) -->
  <div id="rotate-message" role="alert">
    <div class="rotate-icon" aria-hidden="true">&#x1F4F1;&#x21BB;</div>
    <p>Please turn the iPad sideways</p>
  </div>

  <main id="app">
    <!-- Message bar: tapped words appear here. Tap the text area to speak the sentence. -->
    <header id="message-bar">
      <div id="message-text" role="button" aria-label="Speak the whole message">
        <div id="message-chips"></div>
        <!-- Whose board this is (small and subtle) -->
        <span id="learner-name"></span>
      </div>
      <button id="delete-btn" class="bar-btn" type="button">&#x232B; Delete</button>
      <button id="clear-btn" class="bar-btn" type="button">&#x2715; Clear</button>
    </header>

    <!-- Context strip. Phase 3 will show photo-suggested words here.
         Now: shows the page title on category pages, and holds the hidden
         adult-menu target (press and hold 3 seconds at the top-left). -->
    <section id="context-strip">
      <button id="adult-hold" type="button" aria-label="Adult menu (press and hold)">
        <svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="ring-bg" cx="20" cy="20" r="16"/>
          <circle class="ring-fg" cx="20" cy="20" r="16" pathLength="100"/>
        </svg>
      </button>
      <div id="page-title"></div>
    </section>

    <!-- Core grid: 9 x 5 = 45 fixed cells, built by js/board.js -->
    <section id="board" aria-label="Communication board"></section>

    <!-- Edit mode banner: covers the message bar only, so no cell moves -->
    <div id="edit-banner" hidden>
      <span>Editing &mdash; tap any button to change it</span>
      <button id="edit-done" type="button">Done</button>
    </div>
  </main>

  <!-- Model mode banner: a thin strip across the very top -->
  <div id="model-banner" hidden>
    <span>Modeling</span>
    <button id="model-end" type="button" class="hold-bar">End (hold 2 sec)</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
