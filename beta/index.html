<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security (Nov 11): only VOICE's own files may run or load; photos are on-device blob: pictures; no outside connections. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="V.O.I.C.E. (Variable Output for Individualized Communication and Expression): a free, private AAC speech board for iPad. Words never move, vocabulary grows by stages, and everything stays on the device.">
<title>V.O.I.C.E.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V.O.I.C.E. Beta">
<meta name="theme-color" content="#1e6ec8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown only when the iPad is held upright (see styles.css) -->
  <div id="rotate-message" role="alert">
    <!-- Beta 3.35: the learner's own model critter (Dibs unless chosen otherwise) tips over onto its side, then a green check
         (styles.css "Portrait" section). With Reduce Motion it simply shows the critter sideways with the arrow. -->
    <!-- Beta 3.40: Chicago flair (decoration only, silent, behind everything): a band like the city flag (two light-blue stripes and
         four red six-pointed stars) and a skyline along the bottom with two famous towers. -->
    <div class="chi-band" aria-hidden="true">
      <svg viewBox="0 0 400 60" preserveAspectRatio="xMidYMid meet"><g fill="#e4002b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"><polygon points="125.0,17.0 128.1,24.6 136.3,23.5 131.2,30.0 136.3,36.5 128.1,35.4 125.0,43.0 121.9,35.4 113.7,36.5 118.8,30.0 113.7,23.5 121.9,24.6"/><polygon points="175.0,17.0 178.1,24.6 186.3,23.5 181.2,30.0 186.3,36.5 178.1,35.4 175.0,43.0 171.9,35.4 163.7,36.5 168.8,30.0 163.7,23.5 171.9,24.6"/><polygon points="225.0,17.0 228.1,24.6 236.3,23.5 231.2,30.0 236.3,36.5 228.1,35.4 225.0,43.0 221.9,35.4 213.7,36.5 218.8,30.0 213.7,23.5 221.9,24.6"/><polygon points="275.0,17.0 278.1,24.6 286.3,23.5 281.2,30.0 286.3,36.5 278.1,35.4 275.0,43.0 271.9,35.4 263.7,36.5 268.8,30.0 263.7,23.5 271.9,24.6"/></g></svg>
    </div>
    <svg class="chi-skyline" viewBox="0 0 800 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="#175aa3"><path d="M0 120V92H22V80H40V96H58V70H74V88H92V62H110V84H128V74H146V90H160V56H178V78H196V66H214V86H232V60H250V80H268V50H290V72H300V120Z"/><path d="M308 120V44H314V30H320V18H340V30H346V44H352V120Z"/><path d="M352 120V76H370V60H388V82H404V52H420V70H436V120Z"/><path d="M444 120L452 34H476L484 120Z"/><path d="M484 120V68H502V84H520V56H540V76H556V64H574V90H592V58H612V80H628V70H646V88H664V60H682V82H700V74H718V92H736V66H754V84H772V78H800V120Z"/></g>
      <path d="M325 18V2M335 18V4 M458 34V12M470 34V14" stroke="#175aa3" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M447 110L481 70M481 110L447 70M450 74L478 44M478 74L450 44" stroke="#2a74c4" stroke-width="1.6" fill="none"/>
      <g fill="#ffe08a" opacity="0.8"><rect x="64" y="96" width="4" height="5"/><rect x="186" y="84" width="4" height="5"/><rect x="326" y="60" width="4" height="5"/><rect x="334" y="86" width="4" height="5"/><rect x="410" y="80" width="4" height="5"/><rect x="530" y="92" width="4" height="5"/><rect x="602" y="74" width="4" height="5"/><rect x="690" y="96" width="4" height="5"/></g>
    </svg>
    <svg class="rotate-art" viewBox="0 0 220 220" aria-hidden="true">
      <defs><clipPath id="rotate-clip"><circle cx="110" cy="110" r="63.5"/></clipPath></defs>
      <!-- (Beta 3.38) Two matching curved arrows, turned half a turn from each other around the circle's centre (110, 110), both
           counter-clockwise like the turn. Each arrow is ONE shape (shaft and head together) and both fade as one group, so no seams. -->
      <g class="ra-arrow" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
        <path d="M 181.2 50.2 A 93.0 93.0 0 0 0 54.0 35.7 L 48.6 28.5 L 42.6 53.4 L 65.5 50.9 L 60.0 43.7 A 83.0 83.0 0 0 1 173.6 56.6 A 5.0 5.0 0 0 0 181.2 50.2 Z"/>
        <path d="M 38.8 169.8 A 93.0 93.0 0 0 0 166.0 184.3 L 171.4 191.5 L 177.4 166.6 L 154.5 169.1 L 160.0 176.3 A 83.0 83.0 0 0 1 46.4 163.4 A 5.0 5.0 0 0 0 38.8 169.8 Z"/>
      </g>
      <g class="ra-device">
        <circle cx="110" cy="110" r="66" fill="#ffffff" stroke="#0b2f57" stroke-width="5"/>
        <g id="rotate-critter" clip-path="url(#rotate-clip)"></g>
      </g>
      <g class="ra-check"><circle cx="203" cy="110" r="22" fill="#16a34a" stroke="#ffffff" stroke-width="4"/><path d="M 192 111 L 200 119 L 214 102" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>
    <p id="rotate-text">Turn the iPad sideways</p>
    <!-- For adults (Beta 3.35, iPad only): Chance's tip to lock the screen sideways. Small and silent. -->
    <p id="rotate-tip" class="rotate-tip" hidden></p>
    <!-- Adults can still open the menu while the device is upright (Beta 3.24): same 3-second hold and passcode. -->
    <button id="adult-hold-portrait" type="button" aria-label="Adult menu (press and hold 3 seconds)">
      <svg class="adult-gear" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(45 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(90 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(135 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(180 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(225 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(270 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
      <svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="16"/><circle class="ring-fg" cx="20" cy="20" r="16" pathLength="100"/></svg>
    </button>
  </div>

  <main id="app">
    <!-- Message bar: tapped words appear here. Tap the text area to speak the sentence. -->
    <header id="message-bar">
      <span id="message-label" hidden>Speak the whole message:</span>
      <div id="message-text" role="button" aria-labelledby="message-label message-text">
        <!-- The learner's mood (Beta 3.16, js/tonewheel.js): a small face at the left while a mood is set -->
        <span id="mood-badge" hidden></span>
        <div id="message-chips"></div>
        <!-- Whose board this is (small and subtle) -->
        <span id="learner-name"></span>
      </div>
      <!-- Words opens the Words pages (reads "Close" while one is open); Forms opens the forms of the
           last word (go: went, going...). Both are hidden unless the learner's "Show Words button" allows. -->
      <button id="words-btn" class="bar-btn" type="button" hidden>Words</button>
      <button id="forms-btn" class="bar-btn" type="button" hidden disabled>Forms</button>
      <!-- ABC opens the keyboard overlay (over the grid area; the message bar stays visible). Per-learner setting. -->
      <button id="abc-btn" class="bar-btn" type="button" hidden>ABC</button>
      <button id="show-btn" class="bar-btn small-btn" type="button" aria-label="Show the message to the listener" hidden><span class="bb-icon" aria-hidden="true">&#x26F6;</span><span class="bb-text">Show</span></button>
      <button id="delete-btn" class="bar-btn small-btn" type="button" aria-label="Delete"><span class="bb-icon" aria-hidden="true">&#x232B;</span><span class="bb-text">Delete</span></button>
      <button id="clear-btn" class="bar-btn small-btn" type="button" aria-label="Clear"><span class="bb-icon" aria-hidden="true">&#x2715;</span><span class="bb-text">Clear</span></button>
    </header>

    <!-- Context strip. Shows the page title on category pages, and holds the hidden
         adult-menu target (press and hold 3 seconds at the top-left).
         During a teaching session js/session.js puts the adult's small controls here (Phase 2).
         While a scene is active js/scenestrip.js puts the scene's buttons here (Phase 3, beta 3.0). -->
    <section id="context-strip">
      <button id="adult-hold" type="button" aria-label="Adult menu (press and hold 3 seconds)">
        <!-- Beta 3.5: a muted gear so adults can tell what the circle is (js/adulthint.js) -->
        <svg class="adult-gear" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(45 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(90 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(135 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(180 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(225 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(270 12 12)"/><rect x="10.4" y="1.6" width="3.2" height="4.6" rx="0.9" transform="rotate(315 12 12)"/></g><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
        <svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="ring-bg" cx="20" cy="20" r="16"/>
          <circle class="ring-fg" cx="20" cy="20" r="16" pathLength="100"/>
        </svg>
      </button>
      <div id="page-title"></div>
      <!-- Beta 3.14: the Edit and Add-targets buttons live HERE, in the strip under the banner, not in the banner at the top of the
           screen: on an iPhone or iPad the top edge belongs to the system's swipe-down gesture, which can swallow taps there. -->
      <div id="edit-actions" class="strip-actions" hidden>
        <button id="edit-words" type="button" hidden>Words</button>
        <button id="edit-done" type="button">Done</button>
      </div>
      <div id="target-actions" class="strip-actions" hidden>
        <button id="target-words" type="button" hidden>Words</button>
        <!-- Add a sentence (Beta 3.12): take the last word off the sentence being built -->
        <button id="target-undo" type="button" hidden>Undo</button>
        <button id="target-done" type="button">Done</button>
      </div>
      <!-- Camera (Beta 3.1; in the strip since Beta 3.3): hold 1 second, let go, then tap, to take a photo for a quick scene (js/camerabtn.js). A quick tap does nothing.
           Per-learner setting "Show camera button": Auto (from stage 3), Always or Never. -->
      <button id="camera-btn" type="button" hidden aria-label="Camera: hold for one second, then tap, to make a scene from a photo">
        <svg class="cam-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.6-2.2h6.8L17 7h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.6" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="hold-ring cam-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="17"/><circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100"/></svg>
      </button>
    </section>

    <!-- Core grid: 9 x 5 = 45 fixed cells (or 12 x 7 = 84), built by js/board.js -->
    <section id="board" aria-label="Communication board"></section>

    <!-- Edit mode banner: covers the message bar only, so no cell moves -->
    <div id="edit-banner" hidden>
      <span>Editing &mdash; tap any button to change it</span>
    </div>

    <!-- Choose-targets banner (Teaching): covers the message bar only, so no cell moves -->
    <div id="target-banner" hidden>
      <span id="target-banner-text">Tap words to add as targets</span>
      <span id="target-count"></span>
    </div>
  </main>

  <!-- Model mode banner: a thin label across the very top (it ignores touches). Beta 3.11: ending is NOT done up here any more:
       on an iPad opened from the Home Screen the top edge belongs to the system's swipe-down gesture, which delays or cancels
       touches there, so a hold on the banner could never finish. -->
  <div id="model-banner" hidden><span class="mb-label">Modeling</span></div>
  <!-- End modeling: a large button at the right end of the message bar, well away from the screen edge (js/app.js places it).
       Two ordinary taps: the first turns it into "Tap again to end" for 3 seconds, the second ends Model mode. -->
  <button id="model-end" type="button" hidden>End modeling</button>
  <!-- Model a sentence (Beta 3.15): type what you said; VOICE models it on the board (js/modelsentence.js). Placed left of End modeling. -->
  <button id="model-type" type="button" aria-label="Model a sentence: type what you said" title="Model a sentence" hidden>&#x2328; Type</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
