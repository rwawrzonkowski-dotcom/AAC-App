<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOICE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOICE Beta">
<meta name="theme-color" content="#1e6ec8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown only when the iPad is held upright (see styles.css) -->
  <div id="rotate-message" role="alert">
    <div class="rotate-icon" aria-hidden="true">&#x1F4F1;&#x21BB;</div>
    <p>Please turn the iPad sideways</p>
  </div>

  <main id="app">
    <!-- Message bar: tapped words appear here. Tap the text area to speak the sentence. -->
    <header id="message-bar">
      <div id="message-text" role="button" aria-label="Speak the whole message">
        <div id="message-chips"></div>
        <!-- Whose board this is (small and subtle) -->
        <span id="learner-name"></span>
      </div>
      <!-- Words opens the Words pages (reads "Close" while one is open); Forms opens the forms of the
           last word (go: went, going...). Both are hidden unless the learner's "Show Words button" allows. -->
      <button id="words-btn" class="bar-btn" type="button" hidden>Words</button>
      <button id="forms-btn" class="bar-btn" type="button" hidden disabled>Forms</button>
      <!-- ABC opens the keyboard overlay (over the grid area; the message bar stays visible). Per-learner setting. -->
      <button id="abc-btn" class="bar-btn" type="button" hidden>ABC</button>
      <!-- Camera (Beta 3.1): hold 1 second, then lift, to take a photo for a quick scene (js/camerabtn.js). A quick tap does nothing.
           Per-learner setting "Show camera button": Auto (from stage 3), Always or Never. -->
      <button id="camera-btn" class="bar-btn" type="button" hidden aria-label="Camera: hold for one second, then tap, to make a scene from a photo">
        <svg class="cam-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.6-2.2h6.8L17 7h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.6" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="hold-ring cam-ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="17"/><circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100"/></svg>
      </button>
      <button id="delete-btn" class="bar-btn" type="button">&#x232B; Delete</button>
      <button id="clear-btn" class="bar-btn" type="button">&#x2715; Clear</button>
    </header>

    <!-- Context strip. Shows the page title on category pages, and holds the hidden
         adult-menu target (press and hold 3 seconds at the top-left).
         During a teaching session js/session.js puts the adult's small controls here (Phase 2).
         While a scene is active js/scenestrip.js puts the scene's buttons here (Phase 3, beta 3.0). -->
    <section id="context-strip">
      <button id="adult-hold" type="button" aria-label="Adult menu (press and hold)">
        <svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="ring-bg" cx="20" cy="20" r="16"/>
          <circle class="ring-fg" cx="20" cy="20" r="16" pathLength="100"/>
        </svg>
      </button>
      <div id="page-title"></div>
    </section>

    <!-- Core grid: 9 x 5 = 45 fixed cells (or 12 x 7 = 84), built by js/board.js -->
    <section id="board" aria-label="Communication board"></section>

    <!-- Edit mode banner: covers the message bar only, so no cell moves -->
    <div id="edit-banner" hidden>
      <span>Editing &mdash; tap any button to change it</span>
      <button id="edit-words" type="button" hidden>Words</button>
      <button id="edit-done" type="button">Done</button>
    </div>

    <!-- Choose-targets banner (Teaching): covers the message bar only, so no cell moves -->
    <div id="target-banner" hidden>
      <span id="target-banner-text">Tap words to add as targets</span>
      <span id="target-count"></span>
      <button id="target-words" type="button" hidden>Words</button>
      <button id="target-done" type="button">Done</button>
    </div>
  </main>

  <!-- Model mode banner: a thin strip across the very top -->
  <div id="model-banner" hidden>
    <span>Modeling</span>
    <button id="model-end" type="button" class="hold-bar">End (hold 2 sec)</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
