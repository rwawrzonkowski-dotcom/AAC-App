<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Frog: wide smile, big round eyes on top. class="body" = recolorable body colour. -->
  <g stroke="#5b3b2a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse class="body" cx="50" cy="83" rx="26" ry="15" fill="#f5a04a"/>
    <ellipse cx="50" cy="87" rx="14" ry="8.500" fill="#fff4e2" stroke="none"/>
    <ellipse class="body" cx="30" cy="94" rx="10" ry="4.800" fill="#f5a04a"/>
    <ellipse class="body" cx="70" cy="94" rx="10" ry="4.800" fill="#f5a04a"/>
    <!-- eye bumps, then head over them -->
    <circle class="body" cx="32" cy="35" r="13.500" fill="#f5a04a"/>
    <circle class="body" cx="68" cy="35" r="13.500" fill="#f5a04a"/>
    <ellipse class="body" cx="50" cy="57" rx="36" ry="23" fill="#f5a04a"/>
    <circle cx="32" cy="35" r="10" fill="#fff" stroke-width="3"/>
    <circle cx="68" cy="35" r="10" fill="#fff" stroke-width="3"/>
    <path d="M24 60q26 22 52 0" fill="none" stroke-width="3.500"/>
  </g>
  <circle cx="33" cy="36" r="5.200" fill="#2b1d18"/><circle cx="67" cy="36" r="5.200" fill="#2b1d18"/>
  <circle cx="31.200" cy="33.800" r="1.900" fill="#fff"/><circle cx="65.200" cy="33.800" r="1.900" fill="#fff"/>
  <circle cx="45" cy="52" r="1.700" fill="#5b3b2a"/><circle cx="55" cy="52" r="1.700" fill="#5b3b2a"/>
  <ellipse cx="22" cy="63" rx="5" ry="3.300" fill="#f58a9a" fill-opacity=".55"/><ellipse cx="78" cy="63" rx="5" ry="3.300" fill="#f58a9a" fill-opacity=".55"/>
</svg>
